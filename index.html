/* ---------- helpers ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const EMOJI_FONT = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
function emoji(c, ch, x, y, size) { c.font = size + 'px ' + EMOJI_FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x, y); }
function rnd(i, s) { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); }
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- voz ---------- */
let VOICE = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices(), norm = l => l.replace('_', '-').toLowerCase();
    for (const l of ['es-ar', 'es-uy', 'es-419', 'es-us', 'es-mx', 'es-es']) { const v = vs.find(v => norm(v.lang) === l); if (v) { VOICE = v; return; } }
    VOICE = vs.find(v => /^es/i.test(v.lang)) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = VOICE ? VOICE.lang : 'es-ES'; if (VOICE) u.voice = VOICE;
    u.rate = 0.88; u.pitch = 1.15; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- audio suave (sintetizado) ---------- */
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type, vol, slide, delay) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function getNoise() { if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
function loopNoise(type, freq, q) {
  if (!AC) return null;
  const s = AC.createBufferSource(); s.buffer = getNoise(); s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
  const g = AC.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start();
  return { set(v) { g.gain.setTargetAtTime(v, AC.currentTime, 0.05); }, stop() { try { s.stop(); } catch (e) {} } };
}
// motor: un ronroneo bajito
function engine() {
  if (!AC) return null;
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'triangle'; f.type = 'lowpass'; f.frequency.value = 200; g.gain.value = 0;
  o.connect(f); f.connect(g); g.connect(master); o.start();
  return {
    set(r) { const t = AC.currentTime; o.frequency.setTargetAtTime(55 + r * 45, t, 0.15); g.gain.setTargetAtTime(r > 0.02 ? 0.012 + r * 0.025 : 0, t, 0.2); },
    stop() { try { o.stop(); } catch (e) {} }
  };
}

  horn() { tone(370, 0.18, 'triangle', 0.07); tone(466, 0.18, 'triangle', 0.07); tone(370, 0.28, 'triangle', 0.07, null, 0.24); tone(466, 0.28, 'triangle', 0.07, null, 0.24); },

    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.9);

/* ---------- partículas (pantalla) ---------- */
let parts = [];
function addP(o) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, fade: 0.4, r: 4, rot: 0, vr: 0, kind: 'dot', c: '#fff' }, o)); }
const CONF = ['#ff3b30', '#ffcc00', '#34c759', '#2f7bff', '#ff7ad9', '#8e44ff'];
function confetti(x, y, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 450; addP({ kind: 'conf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 320, g: 750, life: 1.6 + Math.random(), c: CONF[i % 6], r: 5 + Math.random() * 5, vr: (Math.random() - 0.5) * 14 }); } }
function sparkles(x, y, n, spread, size) { for (let i = 0; i < n; i++) addP({ kind: 'emoji', ch: '✨', x: x + (Math.random() - 0.5) * spread, y: y + (Math.random() - 0.5) * spread * 0.6, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 80, life: 0.6 + Math.random() * 0.5, r: size }); }
function updParts(dt) { for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0); }
function drawParts(c) {
  for (const p of parts) {
    c.globalAlpha = Math.max(0, Math.min(1, p.life / p.fade));
    if (p.kind === 'conf') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); c.restore(); }
    else if (p.kind === 'bubble') { c.fillStyle = 'rgba(210,240,255,.45)'; c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.22, 0, 7); c.fill(); }
    else if (p.kind === 'emoji') emoji(c, p.ch, p.x, p.y, p.r);
    else { c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1;
}

  c.fillStyle = '#e1e5e8'; c.beginPath(); c.arc(0, 0, r * 0.15, 0, 7); c.fill();

}

        const col = COLORS[this.col]; c.save(); c.translate(p.x, p.y);
        const mg = c.createLinearGradient(0, -78, 0, -130); mg.addColorStop(0, hexA(col, 0.7)); mg.addColorStop(1, hexA(col, 0.25));
        c.fillStyle = mg; c.beginPath(); c.moveTo(-3, -78); c.lineTo(3, -78); c.lineTo(26, -130); c.lineTo(-26, -130); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(0, -130, 16 + Math.sin(this.time * 40) * 3, 0, 7); c.stroke();
        c.fillStyle = '#333'; rr(c, -4, -80, 8, 8, 2); c.fill();
        c.fillStyle = '#9aa1a8'; rr(c, -10, -74, 20, 14, 4); c.fill();
        c.fillStyle = col; rr(c, -18, -60, 36, 86, 10); c.fill();
        c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(-18, -32, 36, 22);
        c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-12, -56, 6, 78);
        c.restore();
      }
    }
    if ((this.washing() || this.phase === 'paint') && !this.drawing && this.time - this.lastAct > 2.5) hand(c, this.ox + 220 * k, this.oy + 140 * k, this.time);
    drawHome(c);
  }
};

/* ---------- ¿DÓNDE ESTÁ EL AUTO...? ---------- */
const CAR_COLORS = [{ n: 'rojo', c: '#ff3b30' }, { n: 'azul', c: '#2f7bff' }, { n: 'amarillo', c: '#ffcc00' }, { n: 'verde', c: '#34c759' }];
const donde = {
  enter() { parts = []; this.time = 0; this.round = 0; this.prev = -1; this.newRound(); },
  newRound() {
    const n = this.round < 6 ? 2 : 3;
    let ids = shuffle([0, 1, 2, 3]).slice(0, n);
    let t = ids[Math.floor(Math.random() * n)];
    if (t === this.prev) { const alt = ids.find(i => i !== this.prev); if (alt !== undefined) t = alt; }
    this.prev = t; this.target = t;
    this.cars = ids.map((id, i) => ({ id, x: -300, vx: 0, delay: i * 0.25, hop: 9, wig: 9, out: false }));
    this.phase = 'in'; this.lastAsk = this.time; this.winT = 0;
  },
  layout() {
    const top = 150, bottom = H - 16, n = this.cars.length, laneH = (bottom - top) / n;
    const carW = Math.min(W * 0.62, laneH * 1.45, 380);
    return { top, laneH, carW, s: carW / 220 };
  },
  ask() { say('¿Dónde está el auto ' + CAR_COLORS[this.target].n + '?'); this.lastAsk = this.time; },
  speaker() { return { x: W - 46, y: 46, r: 32 }; },
  down(p) {
    const sp = this.speaker();
    if (Math.hypot(p.x - sp.x, p.y - sp.y) < sp.r + 10) { sfx.pop(); this.ask(); return; }
    if (this.phase !== 'ask') return;
    const L = this.layout();
    this.cars.forEach((car, i) => {
      const base = L.top + L.laneH * (i + 0.72);
      if (p.x > car.x - L.carW / 2 - 10 && p.x < car.x + L.carW / 2 + 10 && p.y > base - 125 * L.s && p.y < base + 12) {
        if (car.id === this.target) {
          this.phase = 'win'; this.winT = 0; car.out = true; sfx.horn();
          say('¡Muy bien! ¡' + CAR_COLORS[car.id].n + '!');
          confetti(car.x, base - 60 * L.s, 90); sfx.sparkle();
        } else {
          car.wig = 0;
          say('Ese es ' + CAR_COLORS[car.id].n + '. ¿Dónde está el ' + CAR_COLORS[this.target].n + '?');
          this.lastAsk = this.time;
          const tc = this.cars.find(c => c.id === this.target); tc.hop = 0;
        }
      }
    });
  },
  update(dt) {
    this.time += dt; updParts(dt);
    const L = this.layout();
    for (const car of this.cars) {
      car.hop += dt; car.wig += dt;
      if (car.out) { car.vx += 1400 * dt; car.x += car.vx * dt; }
      else if (this.phase === 'in' || this.phase === 'ask' || this.phase === 'win') {
        if (car.delay > 0) car.delay -= dt; else { if (car.x < -L.carW) car.x = -L.carW; car.x += (W / 2 - car.x) * Math.min(1, dt * 3); }
      }
    }
    if (this.phase === 'in' && this.cars.every(c => Math.abs(c.x - W / 2) < 3)) { this.phase = 'ask'; this.ask(); }
    if (this.phase === 'ask' && this.time - this.lastAsk > 8) { this.ask(); this.cars.find(c => c.id === this.target).hop = 0; }
    if (this.phase === 'win') {
      this.winT += dt;
      if (this.winT > 1.6) for (const c of this.cars) c.out = true;
      if (this.winT > 2.6) { this.round++; this.newRound(); }
    }
  },
  draw(c) {
    let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#7fd0ff'); g.addColorStop(1, '#d8f4ff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const L = this.layout();
    c.fillStyle = '#f4ead0'; c.fillRect(0, L.top - 10, W, H);
    this.cars.forEach((car, i) => {
      const base = L.top + L.laneH * (i + 0.72), rh = Math.min(L.laneH * 0.42, 70);
      c.fillStyle = '#5a5f66'; c.fillRect(0, base - rh * 0.55, W, rh);
      c.fillStyle = 'rgba(255,255,255,.8)'; for (let x = ((-this.time * 0) % 60); x < W; x += 60) c.fillRect(x, base + rh * 0.4 - rh * 0.5 - 2, 30, 4);
    });
    this.cars.forEach((car, i) => {
      const base = L.top + L.laneH * (i + 0.72), s = L.s;
      const hy = car.hop < 0.5 ? Math.sin(car.hop / 0.5 * Math.PI) * 30 : 0;
      const wr = car.wig < 0.5 ? Math.sin(car.wig * 40) * 0.05 * (1 - car.wig / 0.5) : 0;
      c.save(); c.translate(car.x, base - hy); c.rotate(wr); c.scale(s, s); c.translate(-110, -118);
      drawCar(c, CAR_COLORS[car.id].c, car.x / 22); c.restore();
    });
    const fs = Math.min(34, W / 13);
    txt(c, '¿Dónde está', W / 2, 98, fs, '#fff');
    txt(c, 'el auto ' + CAR_COLORS[this.target].n + '?', W / 2, 98 + fs * 1.15, fs, '#fff');
    drawParts(c);
    if (this.phase === 'ask' && this.time - this.lastAsk > 6) { const L2 = this.layout(), i = this.cars.findIndex(c => c.id === this.target); hand(c, W / 2 + L2.carW * 0.42, L2.top + L2.laneH * (i + 0.72) + 34, this.time, 40); }
    drawHome(c);
    const sp = this.speaker(); c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(sp.x, sp.y, sp.r, 0, 7); c.fill(); emoji(c, '🔊', sp.x, sp.y + 2, 32);
  }
};

/* ---------- aviso si la moto no arranca ---------- */
const oops = {
  enter() { this.t = 0; parts = []; },
  update(dt) { this.t += dt; },
  draw(c) {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#38b6ff'); g.addColorStop(1, '#c9f1ff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    emoji(c, '🏍️', W / 2, H * 0.3, 110);
    txt(c, '¡Uy! La moto no arrancó', W / 2, H * 0.48, Math.min(30, W / 13), '#fff');
    c.fillStyle = '#123'; c.font = '16px system-ui,sans-serif'; c.textAlign = 'center';
    const words = String(this.msg || '').split(' '); let line = '', y = H * 0.56;
    for (const w of words) { if (c.measureText(line + w).width > W - 60) { c.fillText(line, W / 2, y); line = ''; y += 22; } line += w + ' '; }
    c.fillText(line, W / 2, y);
    drawHome(c);
  }
};
function showOops(msg) { oops.msg = msg; go(oops); }

/* ---------- loop + entrada ---------- */
const pts = new Map();
function go(s) { if (scene && scene.exit) scene.exit(); pts.clear(); try { speechSynthesis.cancel(); } catch (e) {} scene = s; s.enter(); }
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); if (scene && scene.resize) scene.resize(); }
addEventListener('resize', resize);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = { x: e.clientX, y: e.clientY, id: e.pointerId, ok: true };
  if (scene !== menu && hitHome(p)) { sfx.pop(); go(menu); return; }
  pts.set(e.pointerId, p); if (scene.down) scene.down(p);
});
cv.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return; p.x = e.clientX; p.y = e.clientY; if (scene.move) scene.move(p); });
const endP = e => { const p = pts.get(e.pointerId); if (!p) return; pts.delete(e.pointerId); if (scene.up) scene.up(p); };
cv.addEventListener('pointerup', endP); cv.addEventListener('pointercancel', endP);
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pts.clear(); if (scene && scene.up) scene.up({}); if (AC) AC.suspend(); try { speechSynthesis.cancel(); } catch (e) {} }
  else if (AC) AC.resume();
});

resize(); go(menu);
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; scene.update(dt); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); scene.draw(ctx); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
